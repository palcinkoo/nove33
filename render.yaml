services:
  - type: web
    name: nove-server
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: server
    buildCommand: |
      npm install --omit=dev
    startCommand: node index-extended.js
    healthCheckPath: /api/v2/status
    autoDeploy: true
    disk:
      name: nove-files
      mountPath: /var/files
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: FILES_DIR
        value: /var/files
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://nove-dashboard.onrender.com
      - key: FIREBASE_DATABASE_URL
        value: https://nove33-a56e7-default-rtdb.europe-west1.firebasedatabase.app
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: web
    name: nove-dashboard
    runtime: static
    plan: free
    region: oregon
    branch: main
    rootDir: dashboard
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: nove33-a56e7.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: nove33-a56e7
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: nove33-a56e7.appspot.com
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_API_BASE
        value: https://nove-server.onrender.com
      - key: VITE_DASHBOARD_BASE
        value: https://nove-dashboard.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://nove-server.onrender.com/api/$1
      - type: rewrite
        source: /api/v2/*
        destination: https://nove-server.onrender.com/api/v2/$1
